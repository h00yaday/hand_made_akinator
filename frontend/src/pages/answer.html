<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Akinator — Ответ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card" role="main">

      <h1>Ваш персонаж это</h1>

    <section id="game">
      <h2 id="current-answer">Загрузка ответа...</h2>

      <div class="actions" style="margin-top:18px">
        <a class="btn btn-primary" id="end-game" href="/src/pages/home_page.html">Начать заново</a>

      </div>
    </section>

    <footer>
      <button class="btn btn-ghost" onclick="location.href='/src/pages/authors.html'">Авторы</button>
      <p style="margin-top:12px;color:var(--muted)">&copy; 2026 Akinator</p>
    </footer>
  </main>

  <script src="/src/Js/answer.js"></script>

</html>
