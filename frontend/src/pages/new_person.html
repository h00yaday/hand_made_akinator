<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Добавить персонажа — Akinator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card" role="main">
    <h1>Кого вы загадали?</h1>
    <p class="lead">Акинатор ошибся? Помогите ему — расскажите про персонажа, которого вы загадали.</p>

    <form id="new-person-form" method="post" action="/api/characters" enctype="multipart/form-data" novalidate>
      <label for="name">Имя персонажа</label>
      <input id="name" name="name" type="text" placeholder="Например: Гарри Поттер" required />

      <label for="description">Краткое описание / отличительные черты</label>
      <textarea id="description" name="description" placeholder="Опишите персонажа..." required></textarea>

      <label for="image">Фото или изображение (опционально)</label>
      <input id="image" name="image" type="file" accept="image/*" />

      <label for="distinguish">Вопрос, который отличает этого персонажа</label>
      <input id="distinguish" name="distinguish" type="text" placeholder="Например: 'Это персонаж из книг или фильмов?'" />

      <div class="actions">
        <button type="submit" class="btn btn-primary">Отправить</button>
        <a class="btn btn-ghost" href="/src/pages/home_page.html">Отмена</a>
        <span class="hint" id="status" aria-live="polite"></span>
      </div>
    </form>
  </main>

  <script>
    (function(){
      const form = document.getElementById('new-person-form');
      const imgInput = document.getElementById('image');
      const status = document.getElementById('status');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        status.textContent = 'Сохраняю...';
        const data = new FormData(form);
        fetch(form.action, { method: 'POST', body: data })
          .then(res => { if (res.ok) return res.json().catch(()=>({})); throw new Error('Ошибка сети'); })
          .then(json => { status.textContent = 'Спасибо! Персонаж добавлен.'; form.reset(); })
          .catch(err => { status.textContent = 'Ошибка при отправке. Попробуйте снова.'; console.error(err); });
      });
    })();
  </script>
</body>
</html>
