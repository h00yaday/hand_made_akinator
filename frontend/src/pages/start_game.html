<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Akinator — Вопрос</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card" role="main">
    <header class="header">
      <h1>Дай ответ на вопрос</h1>
    </header>

    <section id="game">
      <h2 id="current-question">Загрузка вопроса...</h2>
      <div class="answers">
        <button class="btn btn-primary answer-btn" data-answer="yes">Да</button>
        <button class="btn btn-ghost answer-btn" data-answer="no">Нет</button>
        <button class="btn btn-ghost answer-btn" data-answer="unknown">Я не знаю</button>
        <button class="btn btn-ghost answer-btn" data-answer="probably_yes">Возможно</button>
        <button class="btn btn-ghost answer-btn" data-answer="probably_no">Скорее нет</button>
      </div>

      <div class="actions" style="margin-top:18px">
        <a class="btn" href="/src/pages/home_page.html">Вернуться на главную</a>
      </div>
    </section>
  </main>

  <script src="/src/Js/question.js"></script>
</body>
</html>
