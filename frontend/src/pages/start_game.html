<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator</title>
    <link rel="stylesheet" href="../styles/start_game.css">
</head>
<body>
    <header>
        <h1>Дай ответ на вопрос</h1>
    </header>
    <main>
        <section id="game">
            <h2 id="current-question">Загрузка вопроса...</h2>
            <button class="answer-btn" data-answer="yes">Да</button><br>
            <button class="answer-btn" data-answer="no">Нет</button><br>
            <button class="answer-btn" data-answer="unknown">Я не знаю</button><br>
            <button class="answer-btn" data-answer="probably_yes">Возможно/Скорее да</button><br>
            <button class="answer-btn" data-answer="probably_no">Скорее всего нет</button><br>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Akinator</p>
    </footer>
    <script src="question.js"></script>
</body>
</html>
