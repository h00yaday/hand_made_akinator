version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: akinator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: akinator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: akinator_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: akinator_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/akinator_db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: akinator_frontend
    ports:
      - "80:80"
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src/
        - action: rebuild
          path: ./frontend/index.html
    depends_on:
      - backend

volumes:
  postgres_data: